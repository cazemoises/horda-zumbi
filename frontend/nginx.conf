# Replaces the nginx base image's default server block. The frontend
# connects to the backend via a relative /ws/rooms/{code} path instead of an
# absolute URL, so this proxies that path (with the WebSocket upgrade
# headers) and /health to the backend container, mirroring how the Vite dev
# server would proxy the same paths in local development.
server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default of 1m is small for future asset/uploads growth even
    # though this game has no uploads yet; keep headroom like pdf-reader.
    client_max_body_size 20m;

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://backend:8080;
    }

    # nginx's bundled mime.types has no .mjs entry, so any ES module worker
    # emitted by the Vite build (as *.mjs) would be served as
    # application/octet-stream and rejected by browsers' import(). Map it
    # explicitly in case a future build emits one.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
